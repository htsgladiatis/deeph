        streamIdleTimeoutMs: 1800000
        retryPolicy:
          mode: normal
          maxRetries: 1
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: freepi
    model: particle
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: en
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- insert:
    - id: andrey-extra
      name: "@andrey/dsh-andrey-extra"
      config:
        versionLabel: Andrey Version 0.5.9
- id: compaction-basic
  config:
    thresholdRatio: 0.95
    headroomTokens: 1000
    maxTokens: 8192
