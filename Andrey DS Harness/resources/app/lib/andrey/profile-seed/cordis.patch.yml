# Andrey DS Harness — стартовый слой настроек профиля.
# Кладётся приложением при первом запуске, если профиля ещё нет.
# Провайдеры freePi и Freebuff ходят через локальные маршруты приложения;
# аккаунт добавляется в приложении: меню «…» → «Аккаунты».
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      discovery:
        displayName: discovery
        apiKeyEnv: DISCOVERY_API_KEY
        api: openai-completions
        baseURL: https://discovery-api.intern-ai.org.cn/v1
        models:
          - id: deepseek-v4.1-flash-1017
            name: deepseek-v4.1-flash-1017
            maxTokens: 4000
            input:
              - text
              - image
          - id: glm-5.3
            name: glm-5.3
            maxTokens: 28000
          - id: Atria-Dawn
            name: Atria-Dawn
            input:
              - text
              - image
          - id: Sage-A1.5
            name: Sage-A1.5
            contextWindow: 512000
            input:
              - text
              - image
          - id: intern-s2
            name: 书生-S2
            input:
              - text
              - image
      freepi:
        displayName: freePi
        api: openai-completions
        baseURL: http://127.0.0.1:39147/freepi/v1
        apiKeyEnv: FREEPI_LOCAL_KEY
        maxRequestImages: 4
        maxRequestImageBytes: 4194304
        requestImagePixelBudget: 1048576
        requestImageMaxBytes: 409600
        models:
          - id: particle
            name: Particle-1
            contextWindow: 200000
            maxTokens: 32768
            input:
              - text
              - image
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 200000
            maxTokens: 32768
            input:
